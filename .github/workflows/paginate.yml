name: Paginate

on:
  push:
    branches: [main]
    paths-ignore:
      - "pages/**"
      - "index.md"
      - "agent-index.txt"
  workflow_dispatch:

permissions:
  contents: write  # commit pages/ and index.md
  pages: write     # publish the HTML site
  id-token: write  # required by deploy-pages

concurrency:
  group: paginate
  cancel-in-progress: false

jobs:
  paginate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install markdown==3.11.2

      - id: pages
        uses: actions/configure-pages@v6

      - name: Split source into pages, rebuild index and HTML site
        run: python scripts/paginate.py
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pages index.md agent-index.txt
          if git diff --cached --quiet; then
            echo "Pages already up to date."
            exit 0
          fi
          git commit -m "Regenerate pages (limit: $(jq -r .char_limit paginate.json) chars)"
          git push

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
